<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: transparent;
            margin: 0;
            display: flex;
			flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Oculta el contenedor del temporizador por defecto */
        #content {
            display: none;
            flex-direction: column;
            align-items: center;
        }
        #timer {
            font-size: 120px;
            color: white;
            font-family: sans-serif;
            font-weight: bold;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.9);
        }
		 #title {
            font-size: 60px;
            color: white;
			text-align:center;
            font-family: sans-serif;
            font-weight: bold;
            margin-bottom: 20px;
			text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.9);
        }

        /* Botón de Play */
        #playBtn {
            width: 100px;
            height: 100px;
            background-color: rgba(0, 0, 0, 0.6);
            border: 4px solid white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        #playBtn:hover {
            transform: scale(1.1);
            background-color: rgba(0, 0, 0, 0.85);
        }

        /* Triángulo de ícono Play generado con CSS */
        #playIcon {
            width: 0;
            height: 0;
            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
            border-left: 32px solid white;
            margin-left: 8px; /* Centra ópticamente el triángulo */
        }
    </style>
</head>
<body>
<!-- Botón visible al cargar -->
    <div id="playBtn">
        <div id="playIcon"></div>
    </div>	
<!-- Contenido del temporizador (oculto al inicio) -->
    <div id="content">
        <h1 id="title">Pronto comenzamos...</h1>
        <div id="timer">05:00</div>
    </div>
    <script>
       

const playBtn = document.getElementById('playBtn');
        const content = document.getElementById('content');
         
        const timerElement = document.getElementById('timer');
        
        let t = 300;
        let countdown;
       

       function startTimer(){

       
            // Oculta el botón y muestra el título y el temporizador
            playBtn.style.display = 'none';
            content.style.display = 'flex';

            // Inicia la cuenta regresiva
            countdown = setInterval(() => {
                let m = String(Math.floor(t / 60)).padStart(2, '0');
                let s = String(t % 60).padStart(2, '0');
                
                timerElement.innerText = m + ":" + s;
                
                if (t > 0) {
                    t--;
                } else {
                    clearInterval(countdown);
                    timerElement.innerText = "¡Empezamos!";
                }
            }, 1000);
            }

            const urlParams = new URLSearchParams(window.location.search);
        

        if (urlParams.has('autostart') ) {
            // Si la URL tiene "?auto-start=on", arranca automáticamente siempre que la pestaña esté visible
             document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                    startTimer();
                }
            });
        } else {
           
            // Si se abre de forma normal en un navegador, espera el clic en el botón
            playBtn.addEventListener('click', () => {
                startTimer();
            });
        }

    </script>
</body>
</html>
